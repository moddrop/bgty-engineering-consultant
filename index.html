<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        background: radial-gradient(circle at top, #1a1a1a, #000000);
        color: #ffd93d;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
    }

    /* Glow background effect */
    body::before {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: #ffd93d;
        filter: blur(150px);
        opacity: 0.15;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-30px); }
    }

    .container {
        position: relative;
        z-index: 1;
        max-width: 600px;
        padding: 20px;
    }

    h1 {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 15px;
        text-transform: uppercase;
        text-shadow: 0 0 10px #ffd93d, 0 0 30px #ffcc00;
    }

    p {
        font-size: 1.2rem;
        opacity: 0.8;
        margin-bottom: 40px;
    }

    .countdown {
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: 3px;
        padding: 15px 25px;
        border: 2px solid #ffd93d;
        border-radius: 12px;
        display: inline-block;
        box-shadow: 0 0 20px rgba(255, 217, 61, 0.4);
    }

    /* Button */
    .notify-btn {
        margin-top: 30px;
        padding: 12px 30px;
        border: none;
        border-radius: 30px;
        background: #ffd93d;
        color: #000;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .notify-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #ffd93d;
    }

    @media (max-width: 500px) {
        h1 {
            font-size: 2.2rem;
        }

        .countdown {
            font-size: 1.4rem;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Coming Soon</h1>
    <p>Something amazing is on the way. Stay tuned.</p>

    <div class="countdown">
        Launching Soon...
    </div>

    <br>
    <button class="notify-btn">Notify Me</button>
</div>

</body>
</html>
